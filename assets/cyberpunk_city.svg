<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050515" />
      <stop offset="40%" stop-color="#120c2b" />
      <stop offset="80%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#4a0e4e" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="magentaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff003c" />
    </linearGradient>
    <linearGradient id="wetStreet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#110e24" />
      <stop offset="50%" stop-color="#090a14" />
      <stop offset="100%" stop-color="#030308" />
    </linearGradient>
    <filter id="neonBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Night Sky -->
  <rect width="1200" height="800" fill="url(#cyberSky)" />

  <!-- Giant Retro Cyber Sun / Hologram Grid Moon -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="140" fill="url(#magentaGlow)" filter="url(#neonBlur)" />
    <!-- Horizontal Synthwave Slice lines -->
    <rect x="-140" y="20" width="280" height="6" fill="#120c2b" />
    <rect x="-140" y="40" width="280" height="9" fill="#120c2b" />
    <rect x="-140" y="65" width="280" height="13" fill="#120c2b" />
    <rect x="-140" y="95" width="280" height="18" fill="#120c2b" />
  </g>

  <!-- Distant Background Buildings -->
  <g fill="#0e0a24" opacity="0.8">
    <rect x="50" y="280" width="90" height="320" />
    <rect x="160" y="220" width="70" height="380" />
    <rect x="250" y="310" width="110" height="290" />
    <rect x="380" y="260" width="80" height="340" />
    <rect x="740" y="270" width="100" height="330" />
    <rect x="860" y="200" width="75" height="400" />
    <rect x="950" y="310" width="120" height="290" />
    <rect x="1090" y="250" width="80" height="350" />
  </g>

  <!-- Midground Megastructures with Neon Windows -->
  <g fill="#080614">
    <!-- Left Mega Tower -->
    <polygon points="40,600 40,160 160,190 160,600" fill="#110d29" />
    <!-- Tower Neon Strips -->
    <line x1="45" y1="170" x2="45" y2="590" stroke="#00f0ff" stroke-width="3" filter="url(#neonBlur)" />
    <line x1="155" y1="200" x2="155" y2="590" stroke="#ff007f" stroke-width="2" filter="url(#neonBlur)" />
    <!-- Windows Grid -->
    <g fill="#ffe600" opacity="0.7">
      <rect x="65" y="220" width="12" height="6" /><rect x="90" y="220" width="12" height="6" /><rect x="115" y="220" width="12" height="6" />
      <rect x="65" y="250" width="12" height="6" /><rect x="115" y="250" width="12" height="6" />
      <rect x="90" y="280" width="12" height="6" /><rect x="115" y="280" width="12" height="6" />
      <rect x="65" y="320" width="12" height="6" /><rect x="90" y="320" width="12" height="6" />
      <rect x="65" y="360" width="12" height="6" /><rect x="115" y="360" width="12" height="6" />
    </g>

    <!-- Center Left Tower -->
    <polygon points="200,600 200,120 280,90 350,130 350,600" fill="#161233" />
    <line x1="280" y1="90" x2="280" y2="20" stroke="#00ffcc" stroke-width="3" />
    <circle cx="280" cy="20" r="4" fill="#ff003c" filter="url(#neonBlur)" />
    <!-- Holographic Sign on Tower -->
    <rect x="220" y="240" width="110" height="50" rx="6" fill="#000000" stroke="#00f0ff" stroke-width="2" filter="url(#neonBlur)" />
    <text x="275" y="272" fill="#00f0ff" font-family="'Courier New', monospace" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="3" filter="url(#neonBlur)">CYBER</text>

    <!-- Center Gap Sky Space with Flying Spinners / Cars -->
    <g transform="translate(480, 290)">
      <polygon points="0,0 70,-8 90,8 15,12" fill="#030208" />
      <!-- Car Trails -->
      <line x1="0" y1="2" x2="-80" y2="4" stroke="#00f0ff" stroke-width="4" opacity="0.8" filter="url(#neonBlur)" />
      <line x1="0" y1="6" x2="-120" y2="8" stroke="#ff0055" stroke-width="4" opacity="0.9" filter="url(#neonBlur)" />
      <!-- Headlight -->
      <polygon points="90,8 190,-10 180,30" fill="#00ffff" opacity="0.25" />
    </g>
    <g transform="translate(680, 200)">
      <polygon points="0,0 50,-5 65,6 10,9" fill="#030208" />
      <line x1="0" y1="2" x2="-60" y2="3" stroke="#ff00ff" stroke-width="3" opacity="0.8" filter="url(#neonBlur)" />
    </g>

    <!-- Center Right Mega Skyscraper -->
    <polygon points="820,600 820,100 960,140 960,600" fill="#140f30" />
    <line x1="825" y1="105" x2="825" y2="590" stroke="#ff007f" stroke-width="3" filter="url(#neonBlur)" />
    <!-- Japanese Katakana Neon Sign -->
    <g transform="translate(990, 180)">
      <rect x="-15" y="-10" width="30" height="150" rx="5" fill="#070412" stroke="#ff0055" stroke-width="2" />
      <text x="0" y="30" fill="#ff0055" font-family="sans-serif" font-weight="900" font-size="26" text-anchor="middle" filter="url(#neonBlur)">ネ</text>
      <text x="0" y="70" fill="#ff0055" font-family="sans-serif" font-weight="900" font-size="26" text-anchor="middle" filter="url(#neonBlur)">オ</text>
      <text x="0" y="110" fill="#ff0055" font-family="sans-serif" font-weight="900" font-size="26" text-anchor="middle" filter="url(#neonBlur)">ン</text>
    </g>

    <!-- Right Tower -->
    <polygon points="1040,600 1040,180 1180,210 1180,600" fill="#110d26" />
    <line x1="1170" y1="210" x2="1170" y2="590" stroke="#00f0ff" stroke-width="3" filter="url(#neonBlur)" />
  </g>

  <!-- Wet Cyber Street & Highway in Foreground -->
  <polygon points="0,580 1200,580 1200,800 0,800" fill="url(#wetStreet)" />

  <!-- Road Neon Perspective Grid -->
  <g stroke="#ff007f" stroke-width="1.5" opacity="0.4">
    <line x1="600" y1="580" x2="100" y2="800" />
    <line x1="600" y1="580" x2="350" y2="800" />
    <line x1="600" y1="580" x2="600" y2="800" stroke="#00f0ff" stroke-width="2.5" />
    <line x1="600" y1="580" x2="850" y2="800" />
    <line x1="600" y1="580" x2="1100" y2="800" />
    <!-- Horizontal Cross grids -->
    <line x1="450" y1="620" x2="750" y2="620" />
    <line x1="330" y1="660" x2="870" y2="660" />
    <line x1="180" y1="710" x2="1020" y2="710" />
    <line x1="0" y1="770" x2="1200" y2="770" stroke-width="2" />
  </g>

  <!-- Wet Street Reflections (Gleaming Neon Lights) -->
  <ellipse cx="280" cy="670" rx="90" ry="10" fill="#00f0ff" opacity="0.3" filter="url(#neonBlur)" />
  <ellipse cx="820" cy="660" rx="100" ry="12" fill="#ff007f" opacity="0.35" filter="url(#neonBlur)" />
  <ellipse cx="600" cy="740" rx="160" ry="14" fill="#7000ff" opacity="0.25" filter="url(#neonBlur)" />

  <!-- Foreground Futuristic Silhouette (Cyborg / Detective under street lamp) -->
  <g transform="translate(560, 620)">
    <!-- Street Lamp Post -->
    <line x1="120" y1="0" x2="120" y2="-120" stroke="#252538" stroke-width="4" />
    <line x1="120" y1="-120" x2="90" y2="-120" stroke="#252538" stroke-width="4" />
    <circle cx="90" cy="-115" r="8" fill="#00ffff" filter="url(#neonBlur)" />
    <!-- Light Cone -->
    <polygon points="90,-110 30,120 150,120" fill="#00ffff" opacity="0.12" />
    <!-- Character with trenchcoat and glowing cyber-eye -->
    <polygon points="85,30 95,30 100,55 105,115 75,115 80,55" fill="#05030a" />
    <circle cx="90" cy="20" r="7" fill="#05030a" />
    <circle cx="88" cy="19" r="1.5" fill="#00ffcc" filter="url(#neonBlur)" />
  </g>
</svg>
