<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="spaceCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="40%" stop-color="#120626" />
      <stop offset="100%" stop-color="#040209" />
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff00cc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="60%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#4facfe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaGold" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffb300" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff5722" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a8ff78" />
      <stop offset="40%" stop-color="#78ffd6" />
      <stop offset="80%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#0a1026" />
    </radialGradient>
    <filter id="cosmicGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Void -->
  <rect width="1200" height="800" fill="url(#spaceCore)" />

  <!-- Nebula Clouds -->
  <ellipse cx="450" cy="350" rx="420" ry="260" fill="url(#nebulaPurple)" transform="rotate(-20 450 350)" />
  <ellipse cx="750" cy="480" rx="380" ry="240" fill="url(#nebulaCyan)" transform="rotate(25 750 480)" />
  <ellipse cx="600" cy="390" rx="280" ry="180" fill="url(#nebulaGold)" />

  <!-- Starfield Clusters -->
  <g fill="#ffffff">
    <!-- Tiny Stars -->
    <circle cx="80" cy="120" r="1.2" opacity="0.8"/><circle cx="160" cy="70" r="1.5" opacity="0.7"/><circle cx="280" cy="190" r="1" opacity="0.9"/>
    <circle cx="340" cy="85" r="1.8" opacity="0.8"/><circle cx="490" cy="140" r="1.2" opacity="0.6"/><circle cx="620" cy="75" r="1.5" opacity="0.9"/>
    <circle cx="750" cy="110" r="1" opacity="0.7"/><circle cx="890" cy="60" r="1.6" opacity="0.85"/><circle cx="1020" cy="130" r="1.3" opacity="0.75"/>
    <circle cx="1120" cy="80" r="1.7" opacity="0.9"/><circle cx="110" cy="420" r="1.4" opacity="0.8"/><circle cx="220" cy="510" r="1" opacity="0.6"/>
    <circle cx="360" cy="650" r="1.5" opacity="0.75"/><circle cx="510" cy="710" r="1.8" opacity="0.9"/><circle cx="670" cy="640" r="1.2" opacity="0.6"/>
    <circle cx="820" cy="730" r="1.4" opacity="0.8"/><circle cx="970" cy="660" r="1.6" opacity="0.7"/><circle cx="1080" cy="540" r="1.2" opacity="0.9"/>
    <!-- Glowing Major Stars -->
    <g fill="#ffffff" filter="url(#cosmicGlow)">
      <circle cx="300" cy="220" r="3.5" /><circle cx="580" cy="180" r="4" /><circle cx="880" cy="320" r="3.2" />
      <circle cx="420" cy="520" r="3" /><circle cx="950" cy="190" r="4.2" /><circle cx="180" cy="620" r="3.5" />
    </g>
    <!-- Cross Diffraction Spikes on Major Star -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.7" filter="url(#cosmicGlow)">
      <line x1="580" y1="150" x2="580" y2="210" />
      <line x1="550" y1="180" x2="610" y2="180" />
      <line x1="950" y1="165" x2="950" y2="215" />
      <line x1="925" y1="190" x2="975" y2="190" />
    </g>
  </g>

  <!-- Giant Ringed Planet (Saturn-like Alien World) -->
  <g transform="translate(850, 480)">
    <!-- Back of Planetary Rings -->
    <ellipse cx="0" cy="0" rx="260" ry="55" fill="none" stroke="#e0c3fc" stroke-width="22" stroke-opacity="0.35" transform="rotate(-25)" />
    <ellipse cx="0" cy="0" rx="220" ry="42" fill="none" stroke="#8ec5fc" stroke-width="12" stroke-opacity="0.5" transform="rotate(-25)" />

    <!-- Planet Sphere -->
    <circle cx="0" cy="0" r="110" fill="url(#planetGrad)" filter="url(#cosmicGlow)" />

    <!-- Planet Atmospheric Bands -->
    <path d="M -105 10 Q 0 -30 105 10 A 110 110 0 0 1 95 60 Q 0 20 -95 60 Z" fill="#00f2fe" opacity="0.2" />
    <path d="M -100 -30 Q 0 -70 100 -30 A 110 110 0 0 1 108 0 Q 0 -40 -108 0 Z" fill="#4facfe" opacity="0.3" />

    <!-- Front of Planetary Rings -->
    <path d="M -235 110 A 260 55 0 0 0 235 -110" fill="none" stroke="#e0c3fc" stroke-width="22" stroke-opacity="0.7" transform="rotate(-25)" />
    <path d="M -200 93 A 220 42 0 0 0 200 -93" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.8" transform="rotate(-25)" />
  </g>

  <!-- Small Glowing Moon / Satellite Planet -->
  <g transform="translate(260, 320)">
    <circle cx="0" cy="0" r="32" fill="#ff758c" filter="url(#cosmicGlow)" />
    <circle cx="-8" cy="-8" r="7" fill="#ff7eb3" opacity="0.5" />
    <circle cx="10" cy="8" r="10" fill="#7928ca" opacity="0.6" />
  </g>

  <!-- Cosmic Space Dust Ribbon / Spiral Arm -->
  <path d="M 0 420 C 350 300, 500 550, 850 320 C 1050 180, 1150 250, 1200 200" fill="none" stroke="url(#nebulaCyan)" stroke-width="60" stroke-linecap="round" opacity="0.3" filter="url(#cosmicGlow)" />
  <path d="M 50 480 C 400 360, 550 580, 900 350" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,15" opacity="0.5" />
</svg>
